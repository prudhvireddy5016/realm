version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: realm-db
    environment:
      POSTGRES_USER: realm
      POSTGRES_PASSWORD: realm_secret
      POSTGRES_DB: realm
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: realm-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://realm:realm_secret@db:5432/realm
      JWT_SECRET: realm_jwt_secret_change_in_prod
      NEWS_API_KEY: placeholder_key
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: realm-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
